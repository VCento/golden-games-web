<!doctype html>
<!--
  Self-contained on purpose: GitHub Pages serves this file for any missing path at any depth,
  so relative asset paths would break. Styles are inline; no images, no scripts.
  DOMAIN SWITCH: change the "Volver al inicio" href to https://goldengamesapp.com/ (README.md).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada | Golden Games</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f2540;
      color: #f5f0e0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 1.25rem;
      line-height: 1.6;
      text-align: center;
    }
    main { padding: 40px 20px; max-width: 34rem; }
    h1 {
      margin: 0 0 12px;
      font-family: Georgia, "Noto Serif", "Times New Roman", serif;
      font-size: 2.25rem;
      line-height: 1.25;
      color: #FFD700;
    }
    p { margin: 0 0 28px; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 8px 24px;
      border-radius: 12px;
      background: #FFD700;
      color: #0a1628;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #FFF8B0; }
    a:focus-visible { outline: 3px solid #FFF8B0; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace esté incompleto o que la página ya no exista.</p>
    <a href="https://vcento.github.io/golden-games-web/">Volver al inicio</a>
  </main>
</body>
</html>
